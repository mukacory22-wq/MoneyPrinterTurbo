name: Commercial narration

# Gera a narração real (Edge TTS) dos projetos de exemplo e devolve o resultado
# como commit no mesmo branch. Existe porque o ambiente de desenvolvimento em
# nuvem não permite WebSocket, que o Edge TTS exige. Sem segredos.
on:
  push:
    branches:
      - ccr-919f8171-lyxy6v
    paths:
      - "examples/commercials/**/plan.json"
      - ".github/workflows/commercial-narration.yml"

permissions:
  contents: write

concurrency:
  group: commercial-narration-${{ github.ref }}
  cancel-in-progress: false

jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python dependencies
        run: pip install edge_tts==7.2.7 pydantic==2.12.5

      - name: Narrate pending projects
        run: |
          set -e
          for d in examples/commercials/*/; do
            if python -c "import json,sys; sys.exit(0 if json.load(open('${d}plan.json'))['status']['narration'] != 'done' else 1)"; then
              python -X utf8 -m app.services.commercial narrate "$d"
            fi
          done

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/commercials
          git diff --cached --quiet || (git commit -m "chore(commercial): narration from CI" && git push)
